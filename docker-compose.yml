services:
  postgres:
    image: postgres:16-alpine
    container_name: wix-hubspot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wix_hubspot
      POSTGRES_PASSWORD: wix_hubspot
      POSTGRES_DB: wix_hubspot
    ports:
      - "5432:5432"
    volumes:
      - wix_hubspot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wix_hubspot -d wix_hubspot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wix_hubspot_pgdata:
